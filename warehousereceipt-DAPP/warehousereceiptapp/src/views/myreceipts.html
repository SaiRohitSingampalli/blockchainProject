<!DOCTYPE html>
<html>
  <head>
    <title>Digital Warehouse Receipts</title>
    <style>
       h1 {
        text-align: center;
        background-color: white;
        color: black;
        width: 100%;
        margin: 0;
      }
      body {
        background-image: url("C:/Users/Pavan Kumar Chella/Box/Spring2023/Blockchain/image.PNG");
        background-size: cover;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
      }
      .receipt-form {
        background-color: white;
        padding: 20px;
        margin: 20px;
        border-radius: 10px;
      }
      .receipt-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .receipt-card {
        background-color: lightblue;
        padding: 20px;
        margin: 20px;
        border-radius: 10px;
        width: 300px;
      }
      .receipt-card h2 {
        margin-top: 0;
      }
      .receipt-card p {
        margin-bottom: 10px;
      }
      .receipt-card button {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Digital Warehouse Receipts</h1>
    <h2>My Receipts</h2>
    <div class="receipt-row">
      <div class="receipt-card">
        <h2>Receipt #1</h2>
        <p>Price: $100</p>
        <button>Activate</button>
        <button>Deactivate</button>
      </div>
      <div class="receipt-card">
        <h2>Receipt #2</h2>
        <p>Price: $200</p>
        <button>Activate</button>
        <button>Deactivate</button>
      </div>
      <div class="receipt-card">
        <h2>Receipt #3</h2>
        <p>Price: $300</p>
        <button>Activate</button>
        <button>Deactivate</button>
      </div>
    </div>
  </body>
</html>
